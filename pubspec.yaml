name: my_first_app
description: "Word Bloom with Word, Color Match, and Letter Match modes."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.1"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  confetti: ^0.7.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  google_mobile_ads: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
  assets:
    - assets/images/
    - assets/audio/
    - assets/words.txt

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FF8CC0"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
